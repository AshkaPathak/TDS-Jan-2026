name: Build and deploy Python app to Azure Web App - ashka-ga8-q9-compute

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare deployment package from Q9 folder
        run: |
          mkdir deploy_package
          cp GA8/q09_compute_service/main.py deploy_package/
          cp GA8/q09_compute_service/requirements.txt deploy_package/
          cp GA8/q09_compute_service/Dockerfile deploy_package/

      - name: Validate app dependencies
        working-directory: deploy_package
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python - <<'PY'
          import main
          print("FastAPI app import successful")
          PY

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            deploy_package
            !deploy_package/antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_694F0FEE1CD44BC0ABADD4B53CF26FA2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CAB220315C42480A8556DCDC53AB17F7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E61BF78307B64B53853478B38DA6803B }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'ashka-ga8-q9-compute'
          slot-name: 'Production'
          package: .
